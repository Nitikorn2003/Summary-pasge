<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปรายการแทง</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container-custom mx-auto">
    <!-- Header Bar -->
    <div class="header-bar d-flex align-items-center justify-content-center position-relative px-2 py-1">
      <span class="fw-bold" style="font-size: 16px;"><i class="bi bi-pencil-square"
          style="-webkit-text-stroke: 0.5px;"></i> ใส่ราคา</span>
      <span class="badge rounded-pill ms-2 fw-normal" id="totalCount"
        style="font-size: 12px; background-color: #2d2c2c; padding: 2px 8px;">0 รายการ</span>
      <a href="add.html" class="btn-close btn-close-white position-absolute end-0 me-2"
        style="transform: scale(0.9); transform-origin: right center;" aria-label="เพิ่มรายการ"></a>
    </div>

    <!-- Sections (display area) -->
    <div id="sectionsWrap" style="margin-bottom: 300px;"></div>
 
    <!-- Fixed Bottom Controls -->
    <div class="fixed-bottom-numpad border-top shadow-lg">
      <!-- Top Row: Bulk Input & Quick Buttons -->
      <div class="bulk-price-section">
        <div class="bulk-left">
          <div class="bulk-title">ราคา"เท่ากัน"ทั้งหมด</div>
          <div class="bulk-input-group">
            <input type="number" class="bulk-input" id="bulkInput" placeholder="ใส่ราคา" onkeydown="if(event.key==='Enter') applyBulkInput()">
            <button class="bulk-add-btn" onclick="applyBulkInput()"><i class="bi bi-plus"></i></button>
          </div>
        </div>
        <div class="bulk-right">
          <div class="quick-price-grid-custom">
            <button class="quick-price-btn" onclick="setBulkPrice(5)">5 ฿</button>
            <button class="quick-price-btn" onclick="setBulkPrice(10)">10 ฿</button>
            <button class="quick-price-btn" onclick="setBulkPrice(20)">20 ฿</button>
            <button class="quick-price-btn" onclick="setBulkPrice(50)">50 ฿</button>
            <button class="quick-price-btn btn-wide" onclick="setBulkPrice(100)">100 ฿</button>
          </div>
        </div>
      </div>

      <!-- Middle Row: Summary Bar -->
      <div class="summary-bar">
        <div class="credit-box">
          <div class="summary-label">ยอดเครดิตคงเหลือ</div>
          <div class="summary-value" id="creditBalance">0 B</div>
        </div>
        <div class="total-box">
          <div class="summary-label">รวมยอดแทง</div>
          <div class="summary-value" id="totalBetAmount">0</div>
        </div>
      </div>

      <!-- Bottom Row: Action Buttons -->
      <div class="action-btns-container">
        <button class="btn-cancel-all">
          <i class="bi bi-slash-circle"></i> ยกเลิกทั้งหมด
        </button>
        <button class="btn-submit-bet">
          <i class="bi bi-check2-circle"></i> ส่งโพย
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>

</html>

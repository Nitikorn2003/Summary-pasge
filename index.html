<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปรายการแทง</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container-custom mx-auto">
    <!-- Header Bar -->
    <div class="header-bar d-flex align-items-center justify-content-center position-relative px-2 py-1">
      <span class="fw-bold" style="font-size: 16px;"><i class="bi bi-pencil-square" style="-webkit-text-stroke: 0.5px;"></i> ใส่ราคา</span>
      <span class="badge rounded-pill ms-2 fw-normal" id="totalCount"
        style="font-size: 12px; background-color: #2d2c2c; padding: 2px 8px;">0 รายการ</span>
      <button class="btn-close btn-close-white position-absolute end-0 me-2" style="transform: scale(0.9); transform-origin: right center;" aria-label="Close" onclick="openAddGlobal()"></button>
    </div>

    <!-- Sections -->
    <div id="sectionsWrap"></div>
  </div>

  <!-- Add Number Modal (Bulk Add) -->
  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title text-warning fw-bold"><i class="bi bi-plus-circle-fill"></i> เพิ่มรายการแทง</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body py-3" style="max-height: 70vh; overflow-y: auto;">
          <div id="bulkAddContainer">
            <!-- Categories will be rendered here dynamically -->
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn btn-success btn-sm px-4" onclick="confirmBulkAdd()">ตกลง (บันทึกทั้งหมด)</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>

</html>

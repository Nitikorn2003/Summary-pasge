<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปรายการแทง</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container-custom mx-auto">
    <!-- Header Bar -->
    <div class="header-bar d-flex align-items-center justify-content-center position-relative px-2 py-1">
      <span class="fw-bold" style="font-size: 16px;"><i class="bi bi-pencil-square"
          style="-webkit-text-stroke: 0.5px;"></i> ใส่ราคา</span>
      <span class="badge rounded-pill ms-2 fw-normal" id="totalCount"
        style="font-size: 12px; background-color: #2d2c2c; padding: 2px 8px;">0 รายการ</span>
      <a href="add.html" class="btn-close btn-close-white position-absolute end-0 me-2"
        style="transform: scale(0.9); transform-origin: right center;" aria-label="เพิ่มรายการ"></a>
    </div>

    <!-- Sections (display area) -->
    <div id="sectionsWrap" style="margin-bottom: 250px;"></div>

    <!-- Bottom Bulk Price Control -->
    <div class="fixed-bottom-numpad p-2 bg-light border-top shadow-lg">
      <div class="text-center mb-1">
        <div style="font-size: 11px; color: #666; font-weight: bold;">ระบุราคาด่วน</div>
        <div id="bulkPriceDisplay" class="fw-bold text-primary" style="font-size: 18px; height: 24px;"></div>
      </div>

      <div class="d-flex gap-2">
        <!-- Left: Manual Numpad -->
        <div class="flex-grow-1">
          <div class="numpad-grid mini">
            <button class="num-btn" onclick="bulkPricePress('1')">1</button>
            <button class="num-btn" onclick="bulkPricePress('2')">2</button>
            <button class="num-btn" onclick="bulkPricePress('3')">3</button>
            <button class="num-btn" onclick="bulkPricePress('4')">4</button>
            <button class="num-btn" onclick="bulkPricePress('5')">5</button>
            <button class="num-btn" onclick="bulkPricePress('6')">6</button>
            <button class="num-btn" onclick="bulkPricePress('7')">7</button>
            <button class="num-btn" onclick="bulkPricePress('8')">8</button>
            <button class="num-btn" onclick="bulkPricePress('9')">9</button>
            <button class="num-btn action-btn btn-confirm" onclick="bulkPriceConfirm()" style="background: #2d2c2c; font-size: 12px;">ตกลง</button>
            <button class="num-btn" onclick="bulkPricePress('0')">0</button>
            <button class="num-btn action-btn btn-backspace" onclick="bulkPriceDelete()">
              <i class="bi bi-backspace"></i>
            </button>
          </div>
        </div>

        <!-- Right: Quick Selection Buttons -->
        <div class="flex-grow-1">
          <div class="quick-price-grid-v">
            <button class="quick-price-btn" onclick="setBulkPrice(5)">5 ฿</button>
            <button class="quick-price-btn" onclick="setBulkPrice(10)">10 ฿</button>
            <button class="quick-price-btn" onclick="setBulkPrice(20)">20 ฿</button>
            <button class="quick-price-btn" onclick="setBulkPrice(50)">50 ฿</button>
            <button class="quick-price-btn wide" onclick="setBulkPrice(100)">100 ฿</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปรายการแทง</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container-custom mx-auto">
    <!-- Header Bar -->
    <div class="header-bar d-flex align-items-center justify-content-center position-relative px-2 py-1">
      <span class="fw-bold" style="font-size: 16px;"><i class="bi bi-pencil-square" style="-webkit-text-stroke: 0.5px;"></i> ใส่ราคา</span>
      <span class="badge rounded-pill ms-2 fw-normal" id="totalCount"
        style="font-size: 12px; background-color: #2d2c2c; padding: 2px 8px;">0 รายการ</span>
      <button class="btn-close btn-close-white position-absolute end-0 me-2" style="transform: scale(0.9); transform-origin: right center;" aria-label="Close" onclick="toggleAddPanel()"></button>
    </div>

    <!-- Add Panel -->
    <div class="add-panel" id="addPanel" style="display: none; background: #fff;">
      
      <!-- Top Tabs (Decorative for now to match image) -->
      <div class="d-flex">
        <div class="flex-grow-1 text-center py-2 fw-bold" style="background: linear-gradient(180deg, #d4af37 0%, #aa7c11 100%); color: #fff;">กดเลขเอง</div>
      </div>

      <!-- Bet Type Selector (Grid) -->
      <div class="bet-type-grid p-2">
        <button class="bet-btn active" data-type="three_top" onclick="toggleBetType('three_top')">
          <div class="btn-name bg-darkred">3ตัวบน</div><div class="btn-val bg-lightred">900</div>
        </button>
        <button class="bet-btn" data-type="three_tod" onclick="toggleBetType('three_tod')">
          <div class="btn-name bg-darkred">3ตัวโต๊ด</div><div class="btn-val bg-lightred">150</div>
        </button>
        <button class="bet-btn" data-type="two_top" onclick="toggleBetType('two_top')">
          <div class="btn-name bg-blue">2ตัวบน</div><div class="btn-val bg-lightblue">90</div>
        </button>
        <button class="bet-btn" data-type="two_bot" onclick="toggleBetType('two_bot')">
          <div class="btn-name bg-blue">2ตัวล่าง</div><div class="btn-val bg-lightblue">90</div>
        </button>
        <button class="bet-btn reverse" data-type="three_reverse" onclick="toggleBetType('three_reverse')">
          <div class="btn-name bg-red">3ตัวกลับ</div><div class="btn-val bg-lightred"><i class="bi bi-shuffle"></i></div>
        </button>
        <button class="bet-btn reverse" data-type="two_reverse" onclick="toggleBetType('two_reverse')">
          <div class="btn-name bg-blue">2ตัวกลับ</div><div class="btn-val bg-lightblue"><i class="bi bi-shuffle"></i></div>
        </button>
      </div>

      <!-- Selected Tags -->
      <div class="text-center py-1 bg-light border-top border-bottom">
        <div style="font-size: 11px; color: #666; margin-bottom: 2px;">รายการที่เลือก</div>
        <div class="selected-tags-bar justify-content-center" id="selectedTags"></div>
      </div>

      <!-- Number Input Boxes -->
      <div class="text-center py-2 bg-white">
        <div style="color: #a67c00; font-size: 16px; font-weight: bold; margin-bottom: 5px;">ระบุตัวเลข</div>
        <div class="number-boxes" id="numberBoxes">
          <div class="num-box"></div>
          <div class="num-box"></div>
          <div class="num-box"></div>
        </div>
        <input type="hidden" id="inputNumber">
      </div>

      <div class="reverse-preview mx-2" id="reversePreview" style="display:none;"></div>

      <!-- Numpad -->
      <div class="numpad-wrapper p-2 bg-white">
        <div class="numpad-grid">
          <button class="num-btn" onclick="numpadPress('1')">1</button>
          <button class="num-btn" onclick="numpadPress('2')">2</button>
          <button class="num-btn" onclick="numpadPress('3')">3</button>
          <button class="num-btn" onclick="numpadPress('4')">4</button>
          <button class="num-btn" onclick="numpadPress('5')">5</button>
          <button class="num-btn" onclick="numpadPress('6')">6</button>
          <button class="num-btn" onclick="numpadPress('7')">7</button>
          <button class="num-btn" onclick="numpadPress('8')">8</button>
          <button class="num-btn" onclick="numpadPress('9')">9</button>
          <button class="num-btn empty" disabled></button>
          <button class="num-btn" onclick="numpadPress('0')">0</button>
          <button class="num-btn empty" disabled></button>
        </div>
        <div class="numpad-actions">
          <button class="action-btn btn-backspace" onclick="numpadDelete()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-backspace-fill" viewBox="0 0 16 16">
              <path d="M15.683 3a2 2 0 0 0-2-2h-7.08a2 2 0 0 0-1.519.698L.241 7.35a1 1 0 0 0 0 1.302l4.843 5.65A2 2 0 0 0 6.603 15h7.08a2 2 0 0 0 2-2zM5.829 5.854a.5.5 0 1 1 .707-.708l2.147 2.147 2.146-2.147a.5.5 0 1 1 .707.708L9.39 8l2.146 2.146a.5.5 0 0 1-.707.708L8.683 8.707l-2.147 2.147a.5.5 0 0 1-.707-.708L7.976 8z"/>
            </svg>
          </button>
          <button class="action-btn btn-clear" onclick="numpadClearAll()">ล้างข้อมูล</button>
        </div>
      </div>

      <!-- Bottom Amount Entry -->
      <div class="bottom-actions p-2 bg-dark">
        <button class="btn-gold-action w-100 p-2 text-center" onclick="showAmountInput()">
          <i class="bi bi-pencil-square"></i> ใส่ราคา
        </button>
      </div>
      
      <!-- Hidden amount input to pop up or be used via JS -->
      <div id="amountEntryArea" class="p-2 bg-dark flex-column" style="display: none; gap: 8px;">
        <div class="d-flex gap-2 w-100">
          <input type="number" id="inputAmount" class="form-control text-center" placeholder="จำนวนเงิน" min="1" style="flex: 1; height: 44px; font-size: 16px;">
          <input type="number" id="inputRate" class="form-control text-center" placeholder="อัตราคูณ (ถ้ามี)" min="0" step="0.01" style="flex: 1; height: 44px; font-size: 14px;">
        </div>
        <button class="btn-gold-action w-100" onclick="addEntry()" style="height: 44px; padding: 0;">
          <i class="bi bi-check-circle"></i> ตกลง
        </button>
      </div>

    </div>

    <!-- Sections -->
    <div id="sectionsWrap"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>

</html>

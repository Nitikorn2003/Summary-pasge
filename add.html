<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เพิ่มรายการ</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container-custom mx-auto d-flex flex-column" style="height: 100vh;">
    <!-- Header Bar -->
    <div class="header-bar d-flex align-items-center justify-content-center position-relative px-2 py-1 flex-shrink-0">
      <span class="fw-bold" style="font-size: 16px;"><i class="bi bi-pencil-square" style="-webkit-text-stroke: 0.5px;"></i> ใส่เลข</span>
      <a href="index.html" class="position-absolute end-0 me-2" style="color: #333; text-decoration: none; font-size: 20px;" aria-label="กลับหน้าหลัก">
        <i class="bi bi-x-lg"></i>
      </a>
    </div>

    <!-- Main Content Area -->
    <div class="d-flex flex-grow-1 overflow-hidden">
      <!-- Left Sidebar: Added Entries List -->
      <div class="sidebar bg-dark text-white p-0 flex-shrink-0" style="width: 240px; overflow-y: auto; border-right: 1px solid #444;">
        <div class="sidebar-header p-2 d-flex justify-content-between align-items-center border-bottom border-secondary sticky-top bg-dark">
          <span class="fw-bold" style="font-size: 13px; color: #ffdc73;"><i class="bi bi-list-ul"></i> รายการแทง</span>
          <span class="badge bg-secondary" id="sidebarCount" style="font-size: 10px;">0 รายการ</span>
        </div>
        <div id="sidebarList" class="p-0">
          <!-- Rendered in JS -->
        </div>
      </div>

      <!-- Right: Add Panel -->
      <div class="add-panel flex-grow-1 d-flex flex-column" style="background: #fff; overflow-y: auto;">
        
        <div class="flex-grow-1">
          <!-- Top Tabs (Informative only) -->
          <div class="text-center py-2 fw-bold" style="background: linear-gradient(180deg, #d4af37 0%, #aa7c11 100%); color: #fff; font-size: 14px;">กดเลขเอง</div>

          <!-- Bet Type Selector (Grid) -->
          <div class="bet-type-grid p-2">
            <button class="bet-btn active" data-type="three_top" onclick="toggleBetType('three_top')">
              <div class="btn-name bg-darkred">3ตัวบน</div><div class="btn-val bg-lightred">900</div>
            </button>
            <button class="bet-btn" data-type="three_tod" onclick="toggleBetType('three_tod')">
              <div class="btn-name bg-darkred">3ตัวโต๊ด</div><div class="btn-val bg-lightred">150</div>
            </button>
            <button class="bet-btn" data-type="two_top" onclick="toggleBetType('two_top')">
              <div class="btn-name bg-blue">2ตัวบน</div><div class="btn-val bg-lightblue">90</div>
            </button>
            <button class="bet-btn" data-type="two_bot" onclick="toggleBetType('two_bot')">
              <div class="btn-name bg-blue">2ตัวล่าง</div><div class="btn-val bg-lightblue">90</div>
            </button>
            <button class="bet-btn reverse" data-type="three_reverse" onclick="toggleBetType('three_reverse')">
              <div class="btn-name bg-red">3ตัวกลับ</div><div class="btn-val bg-lightred"><i class="bi bi-shuffle"></i></div>
            </button>
            <button class="bet-btn reverse" data-type="two_reverse" onclick="toggleBetType('two_reverse')">
              <div class="btn-name bg-blue">2ตัวกลับ</div><div class="btn-val bg-lightblue"><i class="bi bi-shuffle"></i></div>
            </button>
          </div>

          <!-- Selected Tags -->
          <div class="text-center py-1 bg-light border-top border-bottom">
            <div style="font-size: 11px; color: #666; margin-bottom: 2px;">รายการที่เลือก</div>
            <div class="selected-tags-bar justify-content-center" id="selectedTags"></div>
          </div>

          <!-- Number Input Boxes -->
          <div class="text-center py-2 bg-white">
            <div id="currentBetTypeLabel" style="font-size: 13px; color: #d32f2f; font-weight: 600; margin-bottom: 2px;">3ตัวบน</div>
            <div style="color: #a67c00; font-size: 16px; font-weight: bold; margin-bottom: 5px;">ระบุตัวเลข</div>
            <div class="number-boxes" id="numberBoxes">
              <div class="num-box"></div>
              <div class="num-box"></div>
              <div class="num-box"></div>
            </div>
            <input type="hidden" id="inputNumber">
          </div>

          <div class="reverse-preview mx-2" id="reversePreview" style="display:none;"></div>

          <!-- Numpad -->
          <div class="numpad-wrapper p-2 bg-white">
            <div class="numpad-grid">
              <button class="num-btn" onclick="numpadPress('1')">1</button>
              <button class="num-btn" onclick="numpadPress('2')">2</button>
              <button class="num-btn" onclick="numpadPress('3')">3</button>
              <button class="num-btn" onclick="numpadPress('4')">4</button>
              <button class="num-btn" onclick="numpadPress('5')">5</button>
              <button class="num-btn" onclick="numpadPress('6')">6</button>
              <button class="num-btn" onclick="numpadPress('7')">7</button>
              <button class="num-btn" onclick="numpadPress('8')">8</button>
              <button class="num-btn" onclick="numpadPress('9')">9</button>
              <button class="num-btn empty" disabled></button>
              <button class="num-btn" onclick="numpadPress('0')">0</button>
              <button class="num-btn empty" disabled></button>
            </div>
            <div class="numpad-actions">
              <button class="action-btn btn-backspace" onclick="numpadDelete()">
                <i class="bi bi-backspace-fill"></i>
              </button>
              <button class="action-btn btn-clear" onclick="numpadClearAll()">ล้างข้อมูล</button>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="p-2 bg-dark mt-auto">
          <input type="hidden" id="inputRate" value="">
          <button class="btn-gold-action w-100" onclick="window.location.href='index.html'" style="height: 48px; padding: 0; font-size: 18px;">
            <i class="bi bi-pencil-square"></i> ใส่ราคา
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="confirmModal" class="custom-modal-overlay">
    <div class="custom-modal">
      <div class="modal-body">
        คุณต้องการลบรายการแทงทั้งหมดใช่หรือไม่?
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-cancel" onclick="closeConfirmModal()">ยกเลิก</button>
        <button class="modal-btn modal-btn-confirm" onclick="confirmClearAll()">ลบทั้งหมด</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="add.js"></script>
</body>

</html>
